# Installed as hypridle.service.d/ionix.conf.
[Unit]
# The live medium's user has no password to unlock with, and an install outlasts any timeout.
ConditionPathExists=!/run/archiso

[Service]
# Where ionix-idle writes hypridle's config. Searched after ~/.config/hypr, so a
# config of the user's own still wins.
Environment=XDG_CONFIG_DIRS=%S/ionix/idle:/etc/xdg
